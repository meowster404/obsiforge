name: Build & Release Windows Executable

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .EXE Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_NEON_DATABASE_URL: ${{ secrets.VITE_NEON_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_BASE_TUNNEL_DOMAIN: ${{ secrets.VITE_BASE_TUNNEL_DOMAIN || 'obsiforge.ply.gg' }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Compile Windows .EXE via electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ObsiForge-Windows-Installer
          path: release/*.exe

      - name: Publish GitHub Release (on tag or manual trigger)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'b') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
